name: Verify and publish ALU
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Simulate all 2,048 vectors
        run: |
          mkdir -p checks
          iverilog -g2012 -s alu4_tb -o checks/alu-test rtl/alu4.sv tb/alu4_tb.sv
          iverilog -g2012 -s presets_tb -o checks/presets-test rtl/alu4.sv tb/presets_tb.sv
          (cd checks && vvp alu-test && vvp presets-test)
      - name: Check the combinational netlist
        shell: bash
        run: |
          yosys -V
          yosys -s scripts/synth.ys | tee checks/synthesis.txt
      - name: Build demo from simulated RTL
        run: |
          mkdir -p dist
          node scripts/build-preview.cjs --public dist/index.html
      - name: Save simulation and synthesis results
        uses: actions/upload-artifact@v6.0.0
        with:
          name: alu-verification
          path: |
            checks/vectors.csv
            checks/presets.vcd
            checks/synthesis.txt
      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish demo
        id: pages
        uses: actions/deploy-pages@v5.0.1
